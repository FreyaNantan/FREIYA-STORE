}

body{

}


/* HEADER */

header{
    background:#0099ff;
    color:white;
    padding:20px;
}

header h1{
    display:inline;
}

nav{
    float:right;
}

nav a{

}

.hero{

    align-items:center;

    background:#e5f3ff;
}

.hero h2{

}


/* BUTTON */

button{
    background:#0099ff;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#0099ff;
}


/* PRODUK */

.container{
    padding:30px;
}

.produk{
    background:white;
    width:250px;
    display:inline-block;
    margin:15px;
    padding:15px;
    text-align:center;
    box-shadow:0 0 10px #2389e9;
}

.produk img{
    width:200px;
    height:200px;
    object-fit:cover;
    color: rgb(0, 0, 0);
    border: 1px solid #002442;
}


/* TABLE */

table{
    width:80%;
    margin:30px auto;
    border-collapse:collapse;
}

td,th{
    border:1px solid black;
    padding:10px;
}


/* FORM */

form{
    background:white;
    padding:20px;
    width:400px;
    margin:20px;
}

input,textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
}


footer{
    background:#0099ff;
    color:white;
    padding:20px;
    text-align:center;
}

.bar{
    background: #0099ff;
    color: rgb(255, 255, 255);
    border: none;
    padding: 10px 20px;       /* Jarak atas-bawah dikecilkan jadi 10px agar tidak terlalu besar */
    display: inline-block;    /* Wajib! Membuat kotak otomatis mengikuti panjang teks */
    cursor: pointer;
    border-radius: 20px; border: 1px solid #003fb4;
}
